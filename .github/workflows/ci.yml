name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Ruff linting
      run: |
        echo "Running Ruff linter..."
        ruff check .

    - name: Run Ruff formatting check
      run: |
        echo "Checking code formatting..."
        ruff format --check .

    - name: Run Bandit security scan
      run: |
        echo "Running Bandit security scan..."
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . --severity-level medium

    - name: Run type checking with mypy
      run: |
        echo "Running mypy type checking..."
        mypy --install-types --non-interactive .
      continue-on-error: true

    - name: Run tests
      run: |
        echo "Running pytest test suite..."
        pytest --tb=short
      continue-on-error: true

    - name: Upload Bandit security report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: bandit-security-report-${{ matrix.python-version }}
        path: bandit-report.json

  dependency-check:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install pip-audit
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit

    - name: Run dependency security audit
      run: |
        echo "Running pip-audit for dependency vulnerabilities..."
        pip-audit --format=json --output=pip-audit-report.json .
        pip-audit .

    - name: Upload dependency audit report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: dependency-audit-report
        path: pip-audit-report.json

  pre-commit-check:
    name: Pre-commit Hooks Validation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install pre-commit
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit

    - name: Run pre-commit on all files
      run: |
        echo "Running pre-commit hooks on all files..."
        pre-commit run --all-files