name: Deploy to Google Cloud Container Registry

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  PROJECT_ID: brflorida
  REGISTRY: gcr.io
  IMAGE_NAME: legal-portal
  REGION: us-central1

jobs:
  build-and-deploy:
    name: Build and Deploy to GCR
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      id: auth
      uses: 'google-github-actions/auth@v0'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v0

    - name: Configure Docker for GCR
      run: 'gcloud auth configure-docker'
    
    - name: Set environment variables
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "ENVIRONMENT=production" >> $GITHUB_ENV
          echo "IMAGE_TAG=latest" >> $GITHUB_ENV
        elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          echo "ENVIRONMENT=staging" >> $GITHUB_ENV
          echo "IMAGE_TAG=staging" >> $GITHUB_ENV
        else
          echo "ENVIRONMENT=staging" >> $GITHUB_ENV
          echo "IMAGE_TAG=pr-${{ github.event.number }}" >> $GITHUB_ENV
        fi
        echo "FULL_IMAGE_NAME=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}" >> $GITHUB_ENV
    
    - name: Build Docker image
      run: |
        docker build \
          --build-arg ENVIRONMENT=${{ env.ENVIRONMENT }} \
          --tag ${{ env.FULL_IMAGE_NAME }} \
          --tag ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          .
    
    - name: Run security scan on image
      run: |
        # Install and run container security scanning
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          -v $(pwd):/workspace \
          aquasec/trivy:latest image \
          --exit-code 1 \
          --severity HIGH,CRITICAL \
          --no-progress \
          ${{ env.FULL_IMAGE_NAME }}
      continue-on-error: true
    
    - name: Push image to Container Registry
      run: |
        docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
    
    - name: Deploy to Cloud Run (staging)
      if: env.ENVIRONMENT == 'staging'
      run: |
        gcloud run deploy legal-portal-staging \
          --image ${{ env.FULL_IMAGE_NAME }} \
          --platform managed \
          --region ${{ env.REGION }} \
          --allow-unauthenticated \
          --set-env-vars="ENVIRONMENT=staging" \
          --set-secrets="OPENAI_API_KEY=OPENAI_API_KEY:latest" \
          --memory=2Gi \
          --cpu=2 \
          --min-instances=0 \
          --max-instances=10 \
          --timeout=3600 \
          --concurrency=10
    
    - name: Deploy to Cloud Run (production)
      if: env.ENVIRONMENT == 'production' && github.event_name == 'push'
      run: |
        gcloud run deploy legal-portal-production \
          --image ${{ env.FULL_IMAGE_NAME }} \
          --platform managed \
          --region ${{ env.REGION }} \
          --allow-unauthenticated \
          --set-env-vars="ENVIRONMENT=production" \
          --set-secrets="OPENAI_API_KEY=OPENAI_API_KEY:latest" \
          --memory=4Gi \
          --cpu=4 \
          --min-instances=1 \
          --max-instances=20 \
          --timeout=3600 \
          --concurrency=10
    
    - name: Get service URL
      run: |
        if [[ "${{ env.ENVIRONMENT }}" == "production" ]]; then
          SERVICE_URL=$(gcloud run services describe legal-portal-production --region=${{ env.REGION }} --format='value(status.url)')
        else
          SERVICE_URL=$(gcloud run services describe legal-portal-staging --region=${{ env.REGION }} --format='value(status.url)')
        fi
        echo "Service deployed at: $SERVICE_URL"
        echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV
    
    - name: Run health check
      run: |
        # Wait for service to be ready
        sleep 30
        
        # Health check with retries
        for i in {1..5}; do
          if curl -f "${{ env.SERVICE_URL }}/_stcore/health" > /dev/null 2>&1; then
            echo "✅ Health check passed"
            break
          else
            echo "❌ Health check failed (attempt $i/5)"
            if [ $i -eq 5 ]; then
              echo "Health check failed after 5 attempts"
              exit 1
            fi
            sleep 10
          fi
        done
    
    - name: Cleanup old images
      run: |
        # Keep only the 10 most recent images
        gcloud container images list-tags ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }} \
          --limit=999999 \
          --sort-by=TIMESTAMP \
          --format="get(digest)" | tail -n +11 | \
        while read digest; do
          gcloud container images delete "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}@$digest" --force-delete-tags --quiet
        done
      continue-on-error: true
    
    - name: Notify deployment status
      if: always()
      run: |
        if [[ "${{ job.status }}" == "success" ]]; then
          echo "🚀 Deployment successful!"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Image: ${{ env.FULL_IMAGE_NAME }}"
          echo "Service URL: ${{ env.SERVICE_URL }}"
        else
          echo "❌ Deployment failed!"
        fi