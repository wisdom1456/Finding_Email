name: Startup Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  startup-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install main requirements
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Install dev requirements if they exist
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
    
    - name: Run startup import tests
      run: |
        echo "Running startup import tests..."
        python tests/test_startup.py
      continue-on-error: true  # Allow workflow to continue even if some imports fail
    
    - name: Check critical imports
      run: |
        cat > check_imports.py << 'EOF'
        import sys
        critical_imports = []
        try:
            # Test core module imports
            from core import EmailReadabilityError
            critical_imports.append('✅ core.EmailReadabilityError')
        except ImportError as e:
            critical_imports.append(f'❌ core.EmailReadabilityError: {e}')
            
        try:
            # Test backend_logic imports
            from backend_logic.email_generation.services.email_generator_v2 import EmailGeneratorV2
            critical_imports.append('✅ backend_logic.email_generation')
        except ImportError as e:
            critical_imports.append(f'❌ backend_logic.email_generation: {e}')
            
        try:
            # Test services imports
            from services import CostSessionManager
            critical_imports.append('✅ services.CostSessionManager')
        except ImportError as e:
            critical_imports.append(f'❌ services.CostSessionManager: {e}')
            
        print('\n'.join(critical_imports))
        
        EOF
        python check_imports.py
    
    - name: Generate test report
      if: always()
      run: |
        echo "## Startup Test Report" > startup-test-report.md
        echo "" >> startup-test-report.md
        echo "### Python Version: ${{ matrix.python-version }}" >> startup-test-report.md
        echo "" >> startup-test-report.md
        echo "### Test Results" >> startup-test-report.md
        echo "" >> startup-test-report.md
        echo "Test execution completed. Check logs for details." >> startup-test-report.md
        
    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: startup-test-report-py${{ matrix.python-version }}
        path: startup-test-report.md
