# Install: pip install pre-commit && pre-commit install
# Mirrors the blocking CI gate (.github/workflows/test.yml): correctness
# rules only, so hooks never block on the pre-existing style backlog.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      - id: ruff
        args: [--select, "F401,F811,F821,F823,F702,E9", --fix]
        files: ^(src|tests|worker)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        exclude: ^\.github/  # workflow files use GH-specific tags
      - id: detect-private-key
      - id: end-of-file-fixer
        files: ^(src|tests|worker)/.*\.py$
