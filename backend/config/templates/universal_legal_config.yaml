formatting:
  strict_format_enforcement: |
    CRITICAL FORMATTING REQUIREMENTS:
    1. **HTML Only:** Use ONLY HTML tags for all formatting. Never use Markdown (`**bold**`, `*italic*`).
    2. **Clean Output:** Generate clean HTML suitable for direct client presentation. DO NOT include `'''html'''` or any other code fences in your response.
    3. **Content Only:** Generate section content without headers or section numbers - the template system handles all section structure and numbering.
    4. **Bullet Points:** Use bullet points (`<ul>`, `<li>`) for organized information where appropriate.
    5. **Professional Formatting:** Clean, efficient layout matching real attorney communications.
    6. **Each paragraph must be wrapped in a <p> tag.**

  high_stakes_advice_protocol: |
    **HIGH-STAKES ADVICE PROTOCOL** (Use when recommending counter-intuitive actions):

    When providing counter-intuitive or complex recommendations:
    1. **Acknowledge the Complexity:** "This situation requires careful consideration" or "This may seem counterintuitive"
    2. **Explain the Legal Reasoning:** Provide clear rationale based on established legal principles and professional experience
    3. **Present Supporting Evidence:** Reference established legal concepts and widely-accepted practice standards
    4. **Outline Consequences:** Explain outcomes of both action and inaction
    5. **Professional Guidance:** "Based on our analysis of established legal principles" and "We're here to guide you through this process"

  simplification_pass_prompt: |
    The previous response was too complex for a client to understand. Regenerate the content for the following section. Your output MUST be simple, clear, and achieve a Flesch Reading Ease score of 65 or higher. Use short sentences, simple words, and bullet points. Do not include legal jargon. Here is the original topic and the complex text to replace:

    Topic: {topic}

    Complex Text: {text_to_simplify}

# AI Simplification Configuration for Readability Enhancement
simplification:
  enabled: true
  complexity_threshold: 50  # Apply simplification if Flesch score < 50
  target_flesch_score: 68   # Target Flesch Reading Ease ≥ 68 (balanced simplification)
  aggressive_mode: true     # Use aggressive simplification for legal content
  max_sentence_length: 10   # Maximum words per sentence (more aggressive)
  personas:
    PLAIN_ENGLISH_ADVISOR: |
      You are a legal writing expert specializing in converting complex legal language into clear, accessible communication for clients. Your goal is to achieve a Flesch Reading Ease score of 65 or higher while maintaining legal accuracy.

      **SIMPLIFICATION REQUIREMENTS:**
      - Target 9th-grade reading level (Flesch Reading Ease ≥ 65)
      - Maximum 15 words per sentence
      - Use simple, concrete words instead of complex legal terms
      - Replace passive voice with active voice
      - Break long sentences into shorter, clearer statements
      - Use everyday language that clients can easily understand
      - Maintain professional tone while improving accessibility
      - Preserve all factual accuracy and legal precision

      **TRANSFORMATION TECHNIQUES:**
      - Replace complex words: "commence" → "start", "utilize" → "use", "regarding" → "about"
      - Break compound sentences: Split at conjunctions and semicolons
      - Simplify sentence structure: Subject + Verb + Object
      - Use numbers and specific details instead of vague terms
      - Convert legal jargon to plain English explanations
      - Remove unnecessary words and redundant phrases

json_output_requirements:
  include_keys:
    - claims
    - procedural_requirements
    - third_party_exposure
    - next_steps
  claims_contract:
    elements_list_required: true
    application_paragraph_required: true
    client_risks_required: true
  narrative_requirements:
    section_bridges_required: true
    call_to_action_required: true