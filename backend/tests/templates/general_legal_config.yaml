# Generic Configuration for Legal Cases
client_name: "Default Client"
case_type: "General Legal"
api_url: "http://127.0.0.1:8000/process_documents"

# --- File Handling ---
input_dir: "input"
output_dir: "output"
reference_dir: "reference"
supported_extensions:
  - ".pdf"
  - ".docx"
  - ".txt"
  - ".eml"
video_extensions: []
intake_patterns:
  - "intake"

# --- Validation Rules ---
validation:
  document_intake:
    enabled: true
  email_comparison:
    enabled: false
    reference_file: "reference_email.rtf"
    min_substance_score: 0.7
  ai_analysis:
    enabled: true
    required_sections:
      - "case_summary"
      - "key_documents"
      - "recommendations"

# --- Scoring Weights ---
scoring:
  substance: 0.7
  structure: 0.3
