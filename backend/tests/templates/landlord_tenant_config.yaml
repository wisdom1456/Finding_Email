# Configuration for Landlord-Tenant Cases
client_name: "Default Client"
case_type: "Landlord-Tenant"
api_url: "http://127.0.0.1:8000/process_documents"

# --- File Handling ---
input_dir: "input"
output_dir: "output"
reference_dir: "reference"
supported_extensions:
  - ".pdf"
  - ".docx"
  - ".txt"
  - ".eml"
  - ".jpg"
  - ".jpeg"
  - ".png"
video_extensions:
  - ".mov"
  - ".mp4"
intake_patterns:
  - "Intake for Landlord-Tenant"
  - "intake"

# --- Validation Rules ---
validation:
  document_intake:
    enabled: true
  email_comparison:
    enabled: true
    reference_file: "reference_email.rtf"
    min_substance_score: 0.7
    min_structure_score: 0.75
  ai_analysis:
    enabled: true
    required_sections:
      - "lease_agreement_analysis"
      - "communication_history"
      - "damages_assessment"

# --- Scoring Weights ---
scoring:
  substance: 0.6
  structure: 0.2
  style: 0.1
  tone: 0.1
