# Google Cloud Build configuration for automated deployments
# This file enables CI/CD pipeline for the Legal Portal application

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/legal-portal:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/legal-portal:latest'
      - '--build-arg'
      - 'ENVIRONMENT=production'
      - '.'
    id: 'build-image'
    timeout: 1800s

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/legal-portal:$COMMIT_SHA'
    id: 'push-image-sha'
    waitFor: ['build-image']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/legal-portal:latest'
    id: 'push-image-latest'
    waitFor: ['build-image']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'legal-portal'
      - '--image'
      - 'gcr.io/$PROJECT_ID/legal-portal:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '3600'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--set-env-vars'
      - 'ENVIRONMENT=production'
    id: 'deploy-cloud-run'
    waitFor: ['push-image-sha', 'push-image-latest']

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/legal-portal:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/legal-portal:latest'

# Build options
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  
# Timeout for the entire build
timeout: 3600s

# Substitutions (can be overridden)
substitutions:
  _REGION: 'us-central1'

# Available substitution variables:
# $PROJECT_ID - Your Google Cloud project ID
# $COMMIT_SHA - Git commit SHA triggering the build
# $BRANCH_NAME - Git branch name
# $TAG_NAME - Git tag name (if applicable)
# $_REGION - Cloud Run deployment region (default: us-central1)

