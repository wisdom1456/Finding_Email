# Legal Document Analysis Portal - Authentication Configuration
# This file contains authentication settings for the application
# WARNING: Keep this file secure and never commit actual passwords to version control

# User credentials configuration
credentials:
  usernames:
    # Administrator account
    admin:
      email: admin@legalportal.com
      name: System Administrator
      password: $2b$12$iWJQGQZMXK9YOc5H9ERkc.zQzFVVn8UyGNF5DKKPrNQxSZxP5xuWa  # Default: admin123 (CHANGE THIS!)
      role: admin
    
    # Sample user accounts - Add your users here
    john_attorney:
      email: john.attorney@lawfirm.com
      name: John Attorney
      password: $2b$12$CHANGE_THIS_HASH  # Use bcrypt to generate password hashes
      role: user
    
    jane_paralegal:
      email: jane.paralegal@lawfirm.com
      name: Jane Paralegal
      password: $2b$12$CHANGE_THIS_HASH
      role: user
    
    bob_viewer:
      email: bob.viewer@lawfirm.com
      name: Bob Viewer
      password: $2b$12$CHANGE_THIS_HASH
      role: viewer
    
    alice_auditor:
      email: alice.auditor@lawfirm.com
      name: Alice Auditor
      password: $2b$12$CHANGE_THIS_HASH
      role: auditor

# Cookie configuration for session management
cookie:
  name: legal_portal_auth_session
  key: CHANGE_THIS_TO_RANDOM_KEY_USE_SECRETS_TOKEN_URLSAFE_32  # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
  expiry_days: 30

# Pre-authorized email domains (users with these email domains can self-register)
preauthorized:
  emails:
    - "@lawfirm.com"
    - "@legalpartners.com"
    # Add your organization's email domains here

# JWT secret for token generation
jwt_secret: CHANGE_THIS_TO_RANDOM_SECRET_USE_SECRETS_TOKEN_URLSAFE_32

# OAuth/SSO Configuration
# Configure the providers you want to enable
oauth:
  # Google OAuth Configuration
  google:
    enabled: false  # Set to true to enable Google SSO
    # Set these as environment variables:
    # GOOGLE_CLIENT_ID=your_client_id_here
    # GOOGLE_CLIENT_SECRET=your_client_secret_here
    # Instructions: https://developers.google.com/identity/protocols/oauth2
  
  # Microsoft Azure AD Configuration
  azure:
    enabled: false  # Set to true to enable Azure AD SSO
    # Set these as environment variables:
    # AZURE_TENANT_ID=your_tenant_id_here (or 'common' for multi-tenant)
    # AZURE_CLIENT_ID=your_client_id_here
    # AZURE_CLIENT_SECRET=your_client_secret_here
    # Instructions: https://docs.microsoft.com/en-us/azure/active-directory/develop/
  
  # Okta Configuration
  okta:
    enabled: false  # Set to true to enable Okta SSO
    # Set these as environment variables:
    # OKTA_DOMAIN=https://your-domain.okta.com
    # OKTA_CLIENT_ID=your_client_id_here
    # OKTA_CLIENT_SECRET=your_client_secret_here
    # Instructions: https://developer.okta.com/docs/guides/
  
  # Auth0 Configuration
  auth0:
    enabled: false  # Set to true to enable Auth0 SSO
    # Set these as environment variables:
    # AUTH0_DOMAIN=https://your-domain.auth0.com
    # AUTH0_CLIENT_ID=your_client_id_here
    # AUTH0_CLIENT_SECRET=your_client_secret_here
    # Instructions: https://auth0.com/docs/quickstart/webapp/

# OAuth Redirect URI (update for production deployment)
# Set as environment variable:
# OAUTH_REDIRECT_URI=https://your-domain.com/callback

# Session Management Settings
session:
  timeout_minutes: 30  # Session timeout in minutes
  max_sessions_per_user: 3  # Maximum concurrent sessions per user
  enable_session_extension: true  # Allow users to extend their sessions

# Security Settings
security:
  password_min_length: 8
  password_require_uppercase: true
  password_require_lowercase: true
  password_require_numbers: true
  password_require_special: true
  max_login_attempts: 5  # Lock account after this many failed attempts
  lockout_duration_minutes: 15  # How long to lock account after max attempts
  enable_mfa: false  # Multi-factor authentication (future feature)

# Audit Settings
audit:
  enable_audit_logging: true
  audit_log_file: session_audit.log
  retain_logs_days: 90
  log_successful_logins: true
  log_failed_logins: true
  log_permission_denials: true
  log_data_access: true

# Role Definitions and Permissions
# DO NOT MODIFY unless you understand the permission system
roles:
  admin:
    description: "Full system access and user management"
    permissions:
      - view_documents
      - upload_documents
      - generate_letters
      - export_data
      - view_analytics
      - manage_users
      - audit_logs
      - system_config
  
  user:
    description: "Standard user with document processing capabilities"
    permissions:
      - view_documents
      - upload_documents
      - generate_letters
      - export_data
      - view_analytics
  
  viewer:
    description: "Read-only access to documents and analytics"
    permissions:
      - view_documents
      - view_analytics
  
  auditor:
    description: "Access to view documents and audit logs"
    permissions:
      - view_documents
      - view_analytics
      - audit_logs

# IMPORTANT SECURITY NOTES:
# 1. Change all default passwords immediately
# 2. Use strong, unique passwords for each account
# 3. Generate password hashes using bcrypt:
#    python -c "import bcrypt; print(bcrypt.hashpw('your_password'.encode(), bcrypt.gensalt()).decode())"
# 4. Keep this file secure and never commit real passwords to version control
# 5. Use environment variables for sensitive OAuth credentials
# 6. Regularly rotate JWT secrets and cookie keys
# 7. Monitor audit logs for suspicious activity
# 8. Consider implementing MFA for production deployments