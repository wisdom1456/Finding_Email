<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		
		<!-- Primary Meta Tags -->
		<meta name="title" content="Bernhardt Riley | Legal Document Analysis Portal" />
		<meta name="description" content="Secure legal document analysis and case management platform for Bernhardt Riley Attorneys at Law. Streamline your construction defect and real estate litigation workflow." />

		<meta name="theme-color" content="#181A31" />

		<meta property="og:type" content="website" />

		<meta property="twitter:image" content="/og-image.png" />

		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
