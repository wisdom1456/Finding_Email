[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-portal"
version = "0.1.0"
description = "Legal Document Analysis Portal"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "supabase>=2.0.0",
    "python-multipart>=0.0.6",
    "sse-starlette>=2.1.3",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "openai>=1.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "markdown2>=2.4.0",
    "tiktoken>=0.5.1",
    "tenacity>=8.2.3",
    "PyJWT==2.8.0",
    "bcrypt==4.1.2",
    "python-docx>=1.1.0",
    "PyMuPDF>=1.23.0",
    "Pillow>=10.0.0",
    "html2text>=2020.1.16"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# Ruff configuration
[tool.ruff]
line-length = 110
exclude = [
    "venv",
    ".venv",
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "B",   # flake8-bugbear
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D107", # Missing docstring in __init__
    "B008", # Do not perform function calls in argument defaults (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]  # Allow missing docstrings in tests

[tool.ruff.format]
quote-style = "double"
