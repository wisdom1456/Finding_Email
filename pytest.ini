[pytest]
pythonpath = . src app
# manual_validation holds standalone scripts (not pytest tests); they sys.exit(1)
# on import failure, which aborts collection of the entire suite.
norecursedirs = manual_validation
asyncio_default_fixture_loop_scope = function
markers =
    integration: Tests requiring a running local Supabase instance
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:datetime.*